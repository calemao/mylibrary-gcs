<div>
    <h1 class="page-title">Emprestar Livro</h1>

    @if (erro) {
        <div class="alert alert-error">{{ erro }}</div>
    }

    <div class="form-card">
        <div class="form-group">
            <label>Livro *</label>
            @if (carregandoLivros) {
                <p class="available-hint">Carregando livros disponíveis...</p>
            } @else {
                <select class="form-control" [(ngModel)]="livroId">
                    <option [ngValue]="null">Selecione um livro...</option>
                    @for (l of livros; track l.id) {
                        <option [ngValue]="l.id">{{ l.titulo }} — {{ l.autor }}</option>
                    }
                </select>
                @if (livros.length === 0) {
                    <p class="available-hint" style="color: var(--warning);">Nenhum livro disponível no momento.</p>
                }
            }
        </div>

        <div class="form-group">
            <label>Nome da Pessoa *</label>
            <input class="form-control" [(ngModel)]="nomePessoa" placeholder="Nome completo" />
        </div>

        <div class="form-group">
            <label>Telefone</label>
            <input class="form-control" [(ngModel)]="telefone" placeholder="Ex.: (11) 99999-9999" />
        </div>

        <div class="form-group">
            <label>Data de Devolução Prevista *</label>
            <input class="form-control" [(ngModel)]="dataDevolucaoPrevista" type="date" />
        </div>

        <div class="form-actions">
            <button class="btn btn-gold"
                (click)="salvar()"
                [disabled]="livroId === null || !nomePessoa.trim() || !dataDevolucaoPrevista">
                Registrar Empréstimo
            </button>
            <a routerLink="/livros" class="btn btn-secondary">Cancelar</a>
        </div>
    </div>
</div>
