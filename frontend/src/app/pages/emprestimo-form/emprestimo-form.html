<div>
    <h1>Emprestar Livro</h1>

    @if (erro) {
        <p style="color: red">{{ erro }}</p>
    }

    <div>
        <label>Livro *</label>
        @if (carregandoLivros) {
            <p>Carregando livros disponíveis...</p>
        } @else {
            <select [(ngModel)]="livroId">
                <option [ngValue]="null">Selecione um livro...</option>
                @for (l of livros; track l.id) {
                    <option [ngValue]="l.id">{{ l.titulo }} - {{ l.autor }}</option>
                }
            </select>
            @if (livros.length === 0) {
                <p style="color: orange">Nenhum livro disponível no momento.</p>
            }
        }
    </div>

    <div>
        <label>Nome da Pessoa *</label>
        <input [(ngModel)]="nomePessoa" placeholder="Nome completo" />
    </div>

    <div>
        <label>Telefone</label>
        <input [(ngModel)]="telefone" placeholder="Telefone" />
    </div>

    <div>
        <label>Data de Devolução Prevista *</label>
        <input [(ngModel)]="dataDevolucaoPrevista" type="date" />
    </div>

    <button (click)="salvar()" [disabled]="livroId === null || !nomePessoa.trim() || !dataDevolucaoPrevista">
        Registrar Empréstimo
    </button>
    <a routerLink="/livros">Cancelar</a>
</div>
