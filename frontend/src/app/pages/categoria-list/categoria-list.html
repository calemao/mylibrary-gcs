<div>
    <h1>Categorias</h1>
    <a routerLink="/categorias/nova">+ Nova Categoria</a>

    @if (mensagem) {
        <p>{{ mensagem }}</p>
    }

    @if (categorias.length === 0) {
        <p>Nenhuma categoria cadastrada.</p>
    } @else {
        <table>
            <tr>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Ações</th>
            </tr>
            @for (c of categorias; track c.id) {
                <tr>
                    <td>{{ c.nome }}</td>
                    <td>{{ c.descricao }}</td>
                    <td>
                        <button (click)="deletar(c.id!)">Excluir</button>
                    </td>
                </tr>
            }
        </table>
    }

    <a routerLink="/dashboard">Voltar</a>
</div>
