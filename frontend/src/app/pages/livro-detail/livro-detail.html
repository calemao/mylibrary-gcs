@if (livro) {
    <div>
        <h1 class="page-title">{{ livro.titulo }}</h1>

        @if (mensagem) {
            <p class="message-success">{{ mensagem }}</p>
        }

        <div class="detail-card">
            <p class="detail-row"><strong>Autor</strong> {{ livro.autor }}</p>
            <p class="detail-row"><strong>ISBN</strong> {{ livro.isbn || '—' }}</p>
            <p class="detail-row"><strong>Ano</strong> {{ livro.ano || '—' }}</p>
            <p class="detail-row">
                <strong>Status</strong>
                <span class="status-badge"
                    [class.status-disponivel]="livro.status === 'DISPONIVEL'"
                    [class.status-emprestado]="livro.status === 'EMPRESTADO'">
                    {{ livro.status === 'DISPONIVEL' ? 'Disponível' : 'Emprestado' }}
                </span>
            </p>

            <div class="detail-actions">
                <a routerLink="/emprestimos/novo" class="btn btn-gold">Emprestar</a>
                <button class="btn btn-danger" (click)="deletar()">Excluir</button>
                <a routerLink="/livros" class="back-link">Voltar</a>
            </div>
        </div>
    </div>
}
