<div>
    <h1>Novo Livro</h1>

    @if (erro) {
        <p style="color: red">{{ erro }}</p>
    }

    <div>
        <label>Título *</label>
        <input [(ngModel)]="titulo" placeholder="Título do livro" />
    </div>
    <div>
        <label>Autor *</label>
        <input [(ngModel)]="autor" placeholder="Autor" />
    </div>
    <div>
        <label>ISBN</label>
        <input [(ngModel)]="isbn" placeholder="ISBN" />
    </div>
    <div>
        <label>Ano</label>
        <input [(ngModel)]="ano" type="number" placeholder="Ano" />
    </div>
    <div>
        <label>Categoria *</label>
        <select [(ngModel)]="categoriaId">
            <option [ngValue]="null">Selecione...</option>
            @for (c of categorias; track c.id) {
                <option [ngValue]="c.id">{{ c.nome }}</option>
            }
        </select>
    </div>

    <button (click)="salvar()" [disabled]="!titulo.trim() || !autor.trim() || categoriaId === null">Salvar</button>
    <a routerLink="/livros">Cancelar</a>
</div>
